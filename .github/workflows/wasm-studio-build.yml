name: MyVocal WASM Build and Deploy

on:
  push:
    branches:
      - feature/wasm-studio
    paths:
      - "wasm-studio/**"
      - ".github/workflows/wasm-studio-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myvocal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Configure
        working-directory: wasm-studio
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: wasm-studio
        run: cmake --build build --parallel

      - name: Assemble browser files
        run: |
          mkdir -p dist
          cp wasm-studio/index.html wasm-studio/style.css wasm-studio/app.js dist/
          cp wasm-studio/WORLD-LICENSE.txt dist/
          cp wasm-studio/build/engine.js wasm-studio/build/engine.wasm dist/

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: myvocal-studio-wasm
          path: dist/
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
